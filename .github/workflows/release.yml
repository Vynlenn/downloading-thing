name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable zip (version stamped from tag)
        shell: pwsh
        run: ./scripts/publish-portable.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))

      - name: Publish GitHub release
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}"
          ./publish/*.zip
          --title "${{ github.ref_name }}"
          --notes "Portable release. Unzip anywhere and run DeezNutzDownloader.App.exe."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
