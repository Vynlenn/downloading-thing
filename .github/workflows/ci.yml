name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DeezNutzDownloader.sln --configuration Release --nologo

      - name: Test
        run: dotnet test tests/DeezNutzDownloader.Tests/DeezNutzDownloader.Tests.csproj --configuration Release --no-build --nologo
